name: 'smig'
description: 'Run samna-migrate (smig) database migrations: up, check, down, merge, reconcile, lock, rebase, upgrade, stat, test'
author: 'nimtech'
branding:
  icon: 'database'
  color: 'blue'
inputs:
  smig-version:
    description: 'Pinned smig CLI version'
    required: false
    default: '1.5.8'
  command:
    description: 'smig command to run: up, check, down, upgrade, merge, reconcile, lock, rebase, stat, test'
    required: true
    default: 'up'
  schema:
    description: 'Path to migrate.yml'
    required: false
    default: './database/migrate.yml'
  db-dir:
    description: 'Path to the database directory'
    required: false
    default: './database'
  env-file:
    description: 'Optional dotenv file to load before running'
    required: false
  yes:
    description: 'Bypass interactive confirmation prompts'
    required: false
    default: 'true'
  force:
    description: 'Bypass safety checks where the command supports it'
    required: false
    default: 'false'
  args:
    description: 'Extra raw arguments appended to the smig command'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Install smig
      shell: bash
      run: |
        if [ -n "${GH_REPO_TOKEN:-}" ]; then git config --global url."https://${GH_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"; fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset=smig-linux-amd64 ;;
          Linux-ARM64) asset=smig-linux-arm64 ;;
          macOS-X64) asset=smig-darwin-amd64 ;;
          macOS-ARM64) asset=smig-darwin-arm64 ;;
          Windows-X64) asset=smig-windows-amd64.exe ;;
          *) echo "smig has no release binary for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        bin="${RUNNER_TEMP}/smig/bin"
        mkdir -p "$bin"
        curl -fsSL -o "$bin/smig" "https://github.com/nimling/samna-migrate/releases/download/v${{ inputs.smig-version }}/${asset}"
        chmod +x "$bin/smig"
        echo "$bin" >> "$GITHUB_PATH"
    - name: Run smig ${{ inputs.command }}
      shell: bash
      run: |
        ARGS="${{ inputs.command }}"
        [ -n "${{ inputs.schema }}" ] && ARGS="$ARGS --schema=${{ inputs.schema }}"
        [ -n "${{ inputs.db-dir }}" ] && ARGS="$ARGS --db-dir=${{ inputs.db-dir }}"
        [ -n "${{ inputs.env-file }}" ] && ARGS="$ARGS --env=${{ inputs.env-file }}"
        [ "${{ inputs.yes }}" == "true" ] && ARGS="$ARGS --yes"
        [ "${{ inputs.force }}" == "true" ] && ARGS="$ARGS --force"
        [ -n "${{ inputs.args }}" ] && ARGS="$ARGS ${{ inputs.args }}"
        GOMODCACHE="$(go env GOMODCACHE)" smig $ARGS
